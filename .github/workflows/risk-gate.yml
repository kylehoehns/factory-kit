# The risk gate, as a reusable workflow: labels each PR risk:low|medium|high and posts the `risk-gate` status.
# A repo calls it from a workflow triggered by pull_request_target (see template/.github/workflows/risk-gate.yml).
#
# pull_request_target gives the caller a write token even for fork PRs. That is safe ONLY because this never checks out
# or runs PR code: it checks out the caller's BASE branch for .factory/config.yml, and this kit for the script, and
# reads the PR as data through the API. Keep it that way.
name: risk-gate

on:
  workflow_call:
    inputs:
      kit-ref:
        description: The factory-kit version to run the gate from; keep it the same as the @ref you call this with.
        type: string
        default: v1

jobs:
  risk-gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - name: Check out the base branch's policy (never the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          sparse-checkout: .factory
          path: repo
          persist-credentials: false

      - name: Check out the factory kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kylehoehns/factory-kit
          ref: ${{ inputs.kit-ref }}
          path: kit
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: kit/.nvmrc

      - name: Decide the tier
        working-directory: kit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          RISK_GATE_MODE: ${{ vars.RISK_GATE_MODE || 'shadow' }}
          POLICY: ${{ github.workspace }}/repo/.factory/config.yml
        run: |
          npm ci --omit=dev --ignore-scripts --silent
          node src/gate-cli.ts
