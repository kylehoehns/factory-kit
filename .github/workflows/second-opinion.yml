# The independent second opinion, as a reusable workflow. A repo calls it when a PR gets the `claude-review` label
# (see template/.github/workflows/second-review.yml): the factory adds the label to every PR it opens, and again after
# each round that pushes new commits; the maintainer can add it to any PR.
#
# Independent means a different system from the factory that wrote and reviewed the code: its own prompt
# (prompts/second-opinion.md, read from the kit at kit-ref, never from the PR), one summary comment only, and a capped
# number of turns. Its verdict is posted as the
# `second-opinion` status on the commit it read; the risk gate counts a pass toward the low tier.
name: second-opinion

on:
  workflow_call:
    inputs:
      allowed-bots:
        description: The factory app's slug. The action refuses bot-started runs unless the bot is named; never '*'.
        type: string
        required: true
      model:
        description: Sonnet keeps usage modest; a stronger model gives a stronger (pricier) opinion.
        type: string
        default: claude-sonnet-5-5
      kit-ref:
        type: string
        default: v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  second-opinion:
    if: github.event.label.name == 'claude-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
      id-token: write
    steps:
      - name: Note the start time, so only this run's opinion counts
        run: echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check out the factory kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kylehoehns/factory-kit
          ref: ${{ inputs.kit-ref }}
          path: .factory-kit
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .factory-kit/.nvmrc

      # Its inputs as files: the PR, its diff, its ticket, and what earlier rounds said (so a later round reads only
      # what changed and doesn't report the same thing again). The prompt reads only these and the checkout, so the
      # eval harness can replay it offline.
      - name: Gather the inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node .factory-kit/src/opinion-cli.ts

      # The kit's prompt, plus how to deliver the opinion here: as one comment, which the factory reads.
      - name: Load the prompt
        id: prompt
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'text<<PROMPT_END'
            cat .factory-kit/prompts/second-opinion.md
            echo
            echo "Post your opinion as one comment on PR #$PR with \`gh pr comment $PR --body-file -\`, the opinion on"
            echo "stdin. Don't post inline comments: the factory posts each finding on its line as a thread it can"
            echo "answer. Don't approve or request changes: the maintainer decides."
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"

      - name: Second opinion
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed-bots }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ inputs.model }} --max-turns 20
            --allowedTools "Read,Bash(gh pr comment:*)"

      # Read the opinion back and pin the verdict to the commit that was reviewed.
      - name: Record the verdict on the reviewed commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node .factory-kit/src/verdict-cli.ts
